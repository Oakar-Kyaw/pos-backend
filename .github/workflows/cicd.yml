name: CICD

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout source
      - name: Checkout source
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Docker image (npm install/build happens INSIDE the Dockerfile —
      # no need to duplicate it on the runner)
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/pos-backend:latest .

      # Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/pos-backend:latest

      # Sync docker-compose.yml to the server so it never drifts from the repo
      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: 'docker-compose.yml'
          target: '/home/ubuntu/bk'

      # Deploy
      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/bk

            # DOCKER_USERNAME must match the image tag we just pushed above
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            docker compose pull
            docker compose up -d --wait

            docker image prune -f

            echo "✅ Deployment completed successfully!"
