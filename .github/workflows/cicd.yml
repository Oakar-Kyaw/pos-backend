name: CICD

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout source
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Debug workspace
      # --------------------------------------------------
      - name: Debug - list workspace files
        run: |
          echo "Workspace contents:"
          ls -la

          echo "---"

          echo "Looking for docker-compose.yml:"
          find . -iname "docker-compose*.yml" -not -path "./node_modules/*"

          echo "---"

          echo ".gitignore contents:"
          cat .gitignore 2>/dev/null || echo "(no .gitignore)"

      # --------------------------------------------------
      # Login to Docker Hub
      # --------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ==================================================
      # BACKEND
      # ==================================================

      # Build backend image
      - name: Build Docker image for server
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/pos-backend:latest \
            .

      # Push backend image
      - name: Push Docker image for server
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/pos-backend:latest

      # ==================================================
      # NOTIFICATION WORKER
      # ==================================================

      # Build notification worker image
      - name: Build Docker image for notification worker
        run: |
          docker build \
            -f src/notification-worker/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/pos-notification-worker:latest \
            .

      # Push notification worker image
      - name: Push Docker image for notification worker
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/pos-notification-worker:latest

      # ==================================================
      # PRODUCT WORKER
      # ==================================================

      # Build product worker image
      - name: Build Docker image for product worker
        run: |
          docker build \
            -f src/notification-worker/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/pos-product-worker:latest \
            .

      # Push product worker image
      - name: Push Docker image for product worker
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/pos-product-worker:latest

      # ==================================================
      # COPY DOCKER COMPOSE
      # ==================================================

      - name: Copy docker-compose.yaml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: 'docker-compose.yaml'
          target: '/home/ubuntu/bk'

      # ==================================================
      # DEPLOY TO LIGHTSAIL
      # ==================================================

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}

          script: |
            set -e

            cd /home/ubuntu/bk

            # Docker Hub username
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            echo "=========================================="
            echo "Pulling latest Docker images..."
            echo "=========================================="

            docker compose pull

            echo "=========================================="
            echo "Starting containers..."
            echo "=========================================="

            docker compose up -d --wait

            echo "=========================================="
            echo "Running containers:"
            echo "=========================================="

            docker compose ps

            echo "=========================================="
            echo "Cleaning old Docker images..."
            echo "=========================================="

            docker image prune -f

            echo "=========================================="
            echo "✅ Deployment completed successfully!"
            echo "=========================================="
